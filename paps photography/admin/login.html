<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../client/favicon.svg">
    <title>Admin Login - Paps Photography</title>
    <link rel="stylesheet" href="../client/client console.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="../PHOTOGRAPHY.png" alt="Logo" class="login-logo">
            <h2>Admin Login</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Show password">
                        <!-- SVG icon for visibility -->
                    </button>
                </div>
                <button type="submit" class="btn-primary">
                    <span class="btn-text">Login</span>
                </button>
                <p id="login-error" class="login-error"></p>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
