<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Paps Photography. Return to our homepage to explore our wedding, event, and portrait photography services.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://papsphotography.com/404">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Page Not Found - Paps Photography</title>
    <link rel="stylesheet" href="client console.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: clamp(4rem, 15vw, 8rem);
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 400px;
        }
        .error-btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: var(--accent-color);
            color: var(--accent-text);
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        .error-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you're looking for doesn't exist or has been moved. Let's get you back to capturing beautiful moments.</p>
        <a href="client console.html" class="error-btn">Back to Home</a>
    </div>
</body>
</html>
